[package]
name = "gj5-home-service"
version = "2.8.0"
description = "GJ5 HOME SERVICE ERP"
authors = ["GJ5 Enterprise"]
edition = "2021"

[build-dependencies]
tauri-build = "2.0.0"

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-shell = "2.0.0"

[lib]
name = "gj5_home_service_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gj5-home-service"
path = "src/main.rs"